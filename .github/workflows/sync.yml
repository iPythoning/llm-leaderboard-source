name: Sync leaderboard to platforms

on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:
    inputs:
      only_month:
        description: 'Optional YYYY-MM to sync a single month (avoids CF 429 bursts)'
        required: false
        default: ''
      only_targets:
        description: 'Optional comma-separated targets (pulseagent.io,paibao-portal,paibaowork.com)'
        required: false
        default: ''

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/validate.mjs
      - name: Push snapshots to platform ingest endpoints
        env:
          PULSEAGENT_INGEST_URL: ${{ vars.PULSEAGENT_INGEST_URL }}
          PULSEAGENT_INGEST_TOKEN: ${{ secrets.PULSEAGENT_INGEST_TOKEN }}
          PAIBAO_INGEST_URL: ${{ vars.PAIBAO_INGEST_URL }}
          PAIBAO_INGEST_TOKEN: ${{ secrets.PAIBAO_INGEST_TOKEN }}
          PAIBAOWORK_INGEST_URL: ${{ vars.PAIBAOWORK_INGEST_URL }}
          PAIBAOWORK_INGEST_TOKEN: ${{ secrets.PAIBAOWORK_INGEST_TOKEN }}
          ONLY_MONTH: ${{ inputs.only_month }}
          ONLY_TARGETS: ${{ inputs.only_targets }}
        run: node scripts/sync.mjs
