name: Monthly leaderboard generation

on:
  schedule:
    - cron: '0 2 27 * *' # 27th of each month, 02:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Override month (YYYY-MM), defaults to current month'
        required: false
      skip_translations:
        description: 'Generate en+zh only when the translation model is unavailable'
        type: boolean
        required: false
        default: false
      translate_only:
        description: 'Translate an existing snapshot without regenerating the core'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate monthly snapshot
        if: ${{ !inputs.translate_only }}
        env:
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNI_BASE_URL: ${{ vars.OMNI_BASE_URL }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
          MONTH: ${{ inputs.month }}
          SKIP_TRANSLATIONS: ${{ inputs.skip_translations && '1' || '0' }}
        run: node scripts/generate.mjs
      - name: Translate existing snapshot
        if: ${{ inputs.translate_only }}
        env:
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNI_BASE_URL: ${{ vars.OMNI_BASE_URL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
          MONTH: ${{ inputs.month }}
        run: node scripts/translate.mjs
      - name: Validate all snapshots
        run: node scripts/validate.mjs
      - name: Commit to main
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat: leaderboard issue $(date -u +%Y-%m)"
          git push
