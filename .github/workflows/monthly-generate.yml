name: Monthly leaderboard generation

on:
  schedule:
    - cron: '0 2 27 * *' # 27th of each month, 02:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Override month (YYYY-MM), defaults to current month'
        required: false

permissions:
  contents: write

concurrency:
  group: monthly-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate monthly snapshot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTH: ${{ inputs.month }}
        run: node scripts/generate.mjs
      - name: Validate all snapshots
        run: node scripts/validate.mjs
      - name: Commit to main
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat: leaderboard issue $(date -u +%Y-%m)"
          git push
