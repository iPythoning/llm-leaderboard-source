name: Monthly leaderboard generation

on:
  schedule:
    - cron: '0 2 27 * *' # 27th of each month, 02:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Override month (YYYY-MM), defaults to current month'
        required: false
      inspect_models:
        description: 'Inspect available OmniRoute search models'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List OmniRoute model IDs
        if: ${{ inputs.inspect_models }}
        env:
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.OMNI_BASE_URL || 'https://omni.paibao.ai/v1'
          const res = await fetch(`${base}/models`, { headers: { authorization: `Bearer ${process.env.OMNI_API_KEY}` } })
          if (!res.ok) throw new Error(`models: HTTP ${res.status}: ${(await res.text()).slice(0, 300)}`)
          const body = await res.json()
          for (const model of body.data ?? []) {
            console.log(model.id)
          }
          NODE
      - run: npm ci
      - name: Generate monthly snapshot
        env:
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNI_BASE_URL: ${{ vars.OMNI_BASE_URL }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
          MONTH: ${{ inputs.month }}
        run: node scripts/generate.mjs
      - name: Validate all snapshots
        run: node scripts/validate.mjs
      - name: Commit to main
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat: leaderboard issue $(date -u +%Y-%m)"
          git push
