name: Inspect OmniRoute models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List web-search model IDs
        env:
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.OMNI_BASE_URL || 'https://omni.paibao.ai/v1'
          const res = await fetch(`${base}/models`, { headers: { authorization: `Bearer ${process.env.OMNI_API_KEY}` } })
          if (!res.ok) throw new Error(`models: HTTP ${res.status}: ${(await res.text()).slice(0, 300)}`)
          const body = await res.json()
          for (const model of body.data ?? []) {
            if (/sonar|perplex|search|felo/i.test(model.id)) console.log(model.id)
          }
          NODE
